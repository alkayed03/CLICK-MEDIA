kind = "web"
previewPath = "/"
title = "Click Media"
description = "A cinematic portfolio website for Click Media, a Jordanian creative media and production studio showcasing video, photography, branding, and digital experiences."
version = "1.0.0"
id = "artifacts/click-media"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24262

[services.development]
run = "pnpm --filter @workspace/click-media run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/click-media", "run", "build" ]
serve = "static"
publicDir = "artifacts/click-media/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24262"
BASE_PATH = "/"
